services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasklist
      POSTGRES_USER: tasklist
      POSTGRES_PASSWORD: tasklist
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklist -d tasklist"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: tasklist-api
    build:
      context: .
      dockerfile: src/TaskList.Api/Dockerfile
    environment:
      # Development: applies migrations on startup and serves Scalar at /scalar.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=db;Port=5432;Database=tasklist;Username=tasklist;Password=tasklist;Gss Encryption Mode=Disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
