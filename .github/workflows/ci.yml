name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Docker is available on ubuntu-latest, so Testcontainers can start PostgreSQL.
      - name: Test
        run: dotnet test -c Release --no-build --coverlet --coverlet-output-format cobertura

      - name: Coverage report
        if: always()
        run: >
          dotnet reportgenerator
          "-reports:tests/**/TestResults/coverage.cobertura*.xml"
          -targetdir:coverage
          "-reporttypes:MarkdownSummaryGithub;Cobertura"
          "-assemblyfilters:+TaskList.Domain;+TaskList.Application;+TaskList.Infrastructure;+TaskList.Api"
          "-classfilters:-TaskList.Infrastructure.Persistence.Migrations.*"

      - name: Publish coverage summary
        if: always()
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
